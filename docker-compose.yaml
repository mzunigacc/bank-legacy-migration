services:

  # =========================================================
  # INFRAESTRUCTURA
  # =========================================================

  postgres:
    image: postgres:17
    container_name: bank-postgres
    environment:
      POSTGRES_DB: bank_legacy
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/bank_legacy_snapshot.sql:/docker-entrypoint-initdb.d/01-bank-legacy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d bank_legacy"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    container_name: bank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: bank-kafka-init
    depends_on:
      - kafka
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Esperando disponibilidad de Kafka..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 2
        done

        echo "Creando/verificando topic bank.withdrawals..."
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic bank.withdrawals \
          --partitions 3 \
          --replication-factor 1

        echo "Creando/verificando topic bank.payments..."
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic bank.payments \
          --partitions 3 \
          --replication-factor 1

        echo "Topics disponibles:"
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list

  # =========================================================
  # SPRING CLOUD
  # =========================================================

  config-server:
    build:
      context: ./config-server
    image: bank-config-server:eft
    container_name: bank-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    restart: on-failure

  discovery-server:
    build:
      context: ./discovery-server
    image: bank-discovery-server:eft
    container_name: bank-discovery-server
    ports:
      - "8761:8761"
    restart: on-failure

  authorization-server:
    build:
      context: ./authorization-server
    image: bank-authorization-server:eft
    container_name: bank-authorization-server
    ports:
      - "9000:9000"
    environment:
      APP_OAUTH2_ISSUER: http://authorization-server:9000
    restart: on-failure

  # =========================================================
  # MICROSERVICIOS DE NEGOCIO
  # =========================================================

  account-service:
    build:
      context: ./account-service
    image: bank-account-service:eft
    container_name: bank-account-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_legacy
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://authorization-server:9000
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      authorization-server:
        condition: service_started
    restart: on-failure

  payment-service:
    build:
      context: ./payment-service
    image: bank-payment-service:eft
    container_name: bank-payment-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_legacy
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://authorization-server:9000
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      authorization-server:
        condition: service_started
      account-service:
        condition: service_started
    restart: on-failure

  customer-service:
    build:
      context: ./customer-service
    image: bank-customer-service:eft
    container_name: bank-customer-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_legacy
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://authorization-server:9000
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      authorization-server:
        condition: service_started
    restart: on-failure

  # =========================================================
  # BFF POR CANAL
  # =========================================================

  bff-web:
    build:
      context: ./bff-web
    image: bank-bff-web:eft
    container_name: bank-bff-web
    ports:
      - "8441:8441"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://authorization-server:9000
    depends_on:
      - config-server
      - discovery-server
      - authorization-server
      - account-service
      - customer-service
    restart: on-failure

  bff-mobile:
    build:
      context: ./bff-mobile
    image: bank-bff-mobile:eft
    container_name: bank-bff-mobile
    ports:
      - "8442:8442"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://authorization-server:9000
    depends_on:
      - config-server
      - discovery-server
      - authorization-server
      - account-service
    restart: on-failure

  bff-atm:
    build:
      context: ./bff-atm
    image: bank-bff-atm:eft
    container_name: bank-bff-atm
    ports:
      - "8443:8443"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://authorization-server:9000
    depends_on:
      - config-server
      - discovery-server
      - authorization-server
      - account-service
      - payment-service
    restart: on-failure

  # =========================================================
  # ASINCRONÍA
  # =========================================================

  withdrawal-consumer:
    build:
      context: ./withdrawal-consumer
    image: bank-withdrawal-consumer:eft
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  # =========================================================
  # BATCH
  # =========================================================

  batch:
    build:
      context: ./batch
    image: bank-batch:eft
    container_name: bank-batch
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_legacy
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      SPRING_BATCH_JDBC_INITIALIZE_SCHEMA: never
      SPRING_BATCH_JOB_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
